name: docs-bar

# Fail-closed public-bar gate: banned terms must not enter the tree or new commit
# messages. Scope is the whole tree, minus .github/ so the gate cannot match itself.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-bar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gate
        env:
          DENY: ${{ secrets.DOCS_DENY_PATTERN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          THIS_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = pull_request ] && [ -n "$HEAD_REPO" ] && [ "$HEAD_REPO" != "$THIS_REPO" ]; then
            echo "::notice::docs-bar skipped on fork PRs — secret unavailable; maintainer review covers this"
            exit 0
          fi

          if [ -z "${DENY:-}" ]; then
            echo "::error::DOCS_DENY_PATTERN is unset — failing closed"
            exit 1
          fi

          # Self-test: probe assembled at runtime, so no literal banned term lives in this file.
          p1=BO; p2=SS
          if ! printf '%s\n' "$p1$p2" | grep -aiqE -e "$DENY"; then
            echo "::error::self-test failed — pattern did not match its probe; the gate is not firing"
            exit 1
          fi

          # Tree scan. -a is mandatory: one NUL byte hides a whole file from bare grep.
          grep -rainE -e "$DENY" . --exclude-dir=.git --exclude-dir=.github --exclude=.git > /tmp/raw.txt && rc=0 || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::tree scan failed (grep rc=$rc)"; exit 1; }
          # Re-test each hit with inline data-URI payloads stripped — base64 blobs are not prose
          # and match by chance. Only the payload is removed, never the surrounding line.
          sed -E 's#;base64,[A-Za-z0-9+/=]+#;base64,[payload]#g' /tmp/raw.txt > /tmp/stripped.txt
          grep -aiE -e "$DENY" /tmp/stripped.txt > /tmp/hits.txt && rc=0 || rc=$?
          [ "$rc" -le 1 ] || { echo "::error::tree re-scan failed (grep rc=$rc)"; exit 1; }
          if [ -s /tmp/hits.txt ]; then
            echo "::error::banned term(s) in tree"
            cut -d: -f1,2 /tmp/hits.txt
            exit 1
          fi

          # Message scan — new commit bodies only, never author/committer fields.
          if [ "$EVENT" = push ]; then
            if [ -n "$BEFORE" ] && git rev-parse -q --verify "$BEFORE^{commit}" >/dev/null 2>&1; then
              git log --format=%B "$BEFORE..$AFTER" > /tmp/msg.txt
            else
              # New branch or force-push: no usable range. Bounded scan, announced as such.
              echo "::warning::before-sha unusable — message scan limited to the last 20 commits"
              git log --format=%B -n 20 "$AFTER" > /tmp/msg.txt
            fi
          else
            git fetch -q --no-tags origin "+refs/heads/$BASE_REF:refs/remotes/origin/$BASE_REF" || true
            git log --format=%B "origin/$BASE_REF..HEAD" > /tmp/msg.txt
          fi
          if grep -aiqE -e "$DENY" /tmp/msg.txt; then rc=0; else rc=$?; fi
          [ "$rc" -le 1 ] || { echo "::error::message scan failed (grep rc=$rc)"; exit 1; }
          if [ "$rc" -eq 0 ]; then
            echo "::error::banned term(s) in new commit message(s)"
            # Prefix shrinks on short terms so the redaction cannot reconstruct them.
            grep -aoiE -e "$DENY" /tmp/msg.txt | sort -u |
              awk '{n = length($0); printf "  match=%s… (len %d)\n", substr($0, 1, (n > 6 ? 3 : 1)), n}'
            exit 1
          fi

          echo "docs-bar: clean"
